<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordhunter — Puzzle Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14151A;
    --paper: #EDEAE2;
    --paper-dim: #A9A79E;
    --amber: #E8A33D;
    --redact: #C1443C;
    --teal: #4C7C72;
    --card: #1D1F26;
    --border: #2f313c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .stage { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--amber); margin: 0 0 6px;
  }
  h1 { font-family: 'Special Elite', cursive; font-size: 28px; margin: 0 0 22px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1; min-width: 200px;
    background: #14151A; border: 1px solid var(--border); border-radius: 5px;
    color: var(--paper); padding: 11px 12px; font-family: 'Inter', sans-serif; font-size: 14px;
  }
  button {
    background: var(--amber); color: var(--ink); border: none;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12.5px;
    padding: 11px 18px; border-radius: 5px; cursor: pointer; letter-spacing: 0.02em;
  }
  button.secondary { background: transparent; color: var(--paper); border: 1px solid var(--border); }
  button.small { padding: 6px 10px; font-size: 11px; }
  button:disabled { opacity: 0.4; cursor: default; }
  .status { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--paper-dim); margin-top: 10px; }

  .candidate {
    border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 10px;
    background: #191b22;
  }
  .candidate.selected { border-color: var(--teal); }
  .candidate-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .word-label { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: var(--amber); text-transform: uppercase; }
  label.check { display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--paper-dim); }

  textarea.word-edit {
    width: 100%; background: #14151A; border: 1px solid var(--border); border-radius: 5px;
    color: var(--paper); padding: 8px 10px; font-family: 'Inter', sans-serif; font-size: 13px;
    resize: vertical; min-height: 40px; margin-bottom: 10px;
  }

  .chunk-editor { display: flex; align-items: center; flex-wrap: wrap; user-select: none; }
  .letter {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px;
    padding: 4px 1px; color: var(--paper);
  }
  .gap {
    width: 10px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }
  .gap::before {
    content: ''; width: 2px; height: 16px; background: var(--border); border-radius: 1px;
  }
  .gap.active::before { background: var(--amber); width: 3px; }
  .chunk-preview {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--teal); margin-top: 8px;
  }

  .empty-state { color: var(--paper-dim); font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: center; padding: 30px 0; }

  .export-box {
    display: none;
  }
  .export-box.show { display: block; }
  pre#jsonOut {
    background: #0f1014; border: 1px solid var(--border); border-radius: 6px;
    padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--paper); overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  }
  .footer-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .count-pill {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink);
    background: var(--amber); padding: 3px 9px; border-radius: 20px; margin-left: 8px;
  }
</style>
</head>
<body>
<div class="stage">
  <p class="eyebrow">Content Pipeline</p>
  <h1>Puzzle Generator</h1>

  <div class="panel">
    <div class="input-row">
      <input type="text" id="themeInput" placeholder="Theme, e.g. 'Weather Phenomena', 'Space', 'Cooking'">
      <button id="generateBtn">Discover words</button>
    </div>
    <p class="status" id="status">Enter a theme and discover candidate words. Each is checked against the dictionary first, with a backup definition source if it's not found there.</p>
  </div>

  <div class="panel" id="candidatesPanel" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <strong style="font-family:'JetBrains Mono',monospace; font-size:13px;">Candidates</strong>
      <span id="selectedCount" class="count-pill">0 selected</span>
    </div>
    <div id="candidateList"></div>

    <div class="footer-actions" id="loadMoreRow" style="display:none;">
      <button id="loadMoreBtn" class="secondary">Load more words</button>
    </div>

    <div style="margin-top:16px; padding-top:14px; border-top:1px dashed var(--border);">
      <strong style="font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--paper-dim); display:block; margin-bottom:8px;">Know a word that should be in here? Add it directly</strong>
      <div class="input-row">
        <input type="text" id="manualWordInput" placeholder="e.g. 'plankton'">
        <button id="manualAddBtn" class="secondary">Add word</button>
      </div>
    </div>
  </div>

  <div class="panel export-box" id="exportBox">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <strong style="font-family:'JetBrains Mono',monospace; font-size:13px;">Puzzle JSON</strong>
    </div>
    <pre id="jsonOut"></pre>
    <div class="footer-actions">
      <button id="copyBtn">Copy JSON</button>
      <button id="downloadBtn" class="secondary">Download .json</button>
    </div>
  </div>

  <div class="footer-actions" id="buildRow" style="display:none;">
    <button id="buildBtn" disabled>Build puzzle from selected words</button>
  </div>
</div>

<script>
const themeInput = document.getElementById('themeInput');
const generateBtn = document.getElementById('generateBtn');
const statusEl = document.getElementById('status');
const candidatesPanel = document.getElementById('candidatesPanel');
const loadMoreRow = document.getElementById('loadMoreRow');
const loadMoreBtn = document.getElementById('loadMoreBtn');
const manualWordInput = document.getElementById('manualWordInput');
const manualAddBtn = document.getElementById('manualAddBtn');
const candidateList = document.getElementById('candidateList');
const selectedCountEl = document.getElementById('selectedCount');
const buildRow = document.getElementById('buildRow');
const buildBtn = document.getElementById('buildBtn');
const exportBox = document.getElementById('exportBox');
const jsonOut = document.getElementById('jsonOut');

let candidates = []; // { word, definition, chunks: [], boundaries: Set, selected }

// --- Heuristic syllable/chunk splitter (auto-suggestion only — always hand-editable after) ---
function guessChunks(word) {
  word = word.toLowerCase();
  const vowels = "aeiouy";
  const groups = [];
  let i = 0;
  while (i < word.length) {
    const start = i;
    while (i < word.length && !vowels.includes(word[i])) i++;
    while (i < word.length && vowels.includes(word[i])) i++;
    if (i === start) i++; // safety for any stray char
    groups.push(word.slice(start, i));
  }
  // fold a trailing consonant-only group into the previous chunk
  if (groups.length > 1 && !/[aeiouy]/.test(groups[groups.length - 1])) {
    groups[groups.length - 2] += groups.pop();
  }
  // cap at 3 chunks max by merging smallest neighbors, to match typical game feel
  while (groups.length > 3) {
    let smallestIdx = 0;
    for (let k = 1; k < groups.length - 1; k++) {
      if (groups[k].length < groups[smallestIdx].length) smallestIdx = k;
    }
    if (smallestIdx === groups.length - 1) smallestIdx = groups.length - 2;
    groups[smallestIdx] += groups[smallestIdx + 1];
    groups.splice(smallestIdx + 1, 1);
  }
  return groups.length > 1 ? groups : [word];
}

function boundariesFromChunks(word, chunks) {
  const b = new Set();
  let pos = 0;
  for (let i = 0; i < chunks.length - 1; i++) {
    pos += chunks[i].length;
    b.add(pos);
  }
  return b;
}

function chunksFromBoundaries(word, boundaries) {
  const sorted = [...boundaries].sort((a, b) => a - b);
  const chunks = [];
  let prev = 0;
  sorted.forEach(pos => { chunks.push(word.slice(prev, pos)); prev = pos; });
  chunks.push(word.slice(prev));
  return chunks;
}

function truncateDefinition(def) {
  // keep words short and puzzle-like, not full dictionary sentences
  let d = def.split(';')[0].split(',')[0];
  const words = d.split(' ');
  if (words.length > 7) d = words.slice(0, 7).join(' ');
  return d.replace(/\.$/, '');
}

// Datamuse's md=d metadata returns defs as an array of "pos\tdefinition"
// strings (e.g. "n\tan intense storm..."). Take the first usable one.
function parseFirstDefinition(defsArray) {
  if (!defsArray || defsArray.length === 0) return null;
  const first = defsArray[0];
  const tabIdx = first.indexOf('\t');
  const text = tabIdx >= 0 ? first.slice(tabIdx + 1) : first;
  return text && text.trim() ? text.trim() : null;
}

// Dictionary API is tried first (better-phrased, more on-theme definitions);
// Datamuse's md=d definition is the fallback when a word isn't in the
// dictionary or the API is briefly unreachable, so a candidate is never
// dropped just because one source came up empty.
async function buildCandidate(entry) {
  const word = entry.word.toLowerCase();
  const datamuseDef = parseFirstDefinition(entry.defs);
  let definition = null;
  let defSource = null;

  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
    if (res.ok) {
      const data = await res.json();
      const dictDef = data[0]?.meanings?.[0]?.definitions?.[0]?.definition;
      if (dictDef) {
        definition = dictDef;
        defSource = 'dictionary';
      }
    }
  } catch (e) {
    // network hiccup — fall through to the Datamuse definition below
  }

  if (!definition && datamuseDef) {
    definition = datamuseDef;
    defSource = 'datamuse';
  }

  if (!definition) return null; // neither source had anything usable

  const chunks = guessChunks(word);
  return {
    word,
    definition: truncateDefinition(definition),
    defSource,
    chunks,
    boundaries: boundariesFromChunks(word, chunks),
    selected: false,
  };
}

let seenWords = new Set(); // tracks every word already fetched (theme-related or manual) to avoid duplicates
let allFetchedForTheme = []; // full Datamuse pool for the current theme (with defs already attached), so "load more" doesn't re-query

async function discoverWords() {
  const theme = themeInput.value.trim();
  if (!theme) return;

  generateBtn.disabled = true;
  candidates = [];
  seenWords = new Set();
  allFetchedForTheme = [];
  candidateList.innerHTML = '';
  candidatesPanel.style.display = 'none';
  buildRow.style.display = 'none';
  loadMoreRow.style.display = 'none';
  exportBox.classList.remove('show');
  statusEl.textContent = `Searching for words related to "${theme}"...`;

  let related = [];
  try {
    // pull two relation types so narrow themes still return a decent pool:
    // 'ml' = means-like (conceptually related), 'rel_trg' = commonly triggered by the theme word
    // md=d asks Datamuse to include a definition directly in the same response —
    // used as a fallback if the Dictionary API doesn't have the word
    const [mlRes, trgRes] = await Promise.all([
      fetch(`https://api.datamuse.com/words?ml=${encodeURIComponent(theme)}&md=d&max=100`),
      fetch(`https://api.datamuse.com/words?rel_trg=${encodeURIComponent(theme)}&md=d&max=100`),
    ]);
    const [mlData, trgData] = await Promise.all([mlRes.json(), trgRes.json()]);
    related = [...mlData, ...trgData];
  } catch (e) {
    statusEl.textContent = 'Could not reach Datamuse API — check network access.';
    generateBtn.disabled = false;
    return;
  }

  const seenInPool = new Set();
  allFetchedForTheme = related.filter(entry => {
    const w = entry.word.toLowerCase();
    if (!/^[a-z]+$/.test(w) || w.length < 4 || w.length > 12) return false;
    if (seenInPool.has(w)) return false;
    seenInPool.add(w);
    return true;
  });

  if (allFetchedForTheme.length === 0) {
    statusEl.textContent = 'No usable single-word candidates found — try a broader theme, or add words manually below.';
    generateBtn.disabled = false;
    candidatesPanel.style.display = 'block';
    return;
  }

  candidatesPanel.style.display = 'block';
  await processBatch(allFetchedForTheme.splice(0, 20));

  generateBtn.disabled = false;
  updateLoadMoreVisibility();
}

async function processBatch(entries) {
  let added = 0;
  let checked = 0;
  for (const entry of entries) {
    const word = entry.word.toLowerCase();
    if (seenWords.has(word)) continue;
    seenWords.add(word);
    checked++;
    statusEl.textContent = `Checking "${word}" (${checked}/${entries.length})...`;

    const candidate = await buildCandidate(entry);
    if (!candidate) continue; // neither source had a definition — skip

    candidate.selected = candidates.filter(c => c.selected).length < 5;
    candidates.push(candidate);
    added++;
    renderCandidates();
  }

  statusEl.textContent = `${candidates.length} candidates ready (${added} added from this batch). Review words and chunk splits, select 4–8, then build.`;
  buildRow.style.display = 'flex';
  updateBuildState();
}

function updateLoadMoreVisibility() {
  loadMoreRow.style.display = allFetchedForTheme.length > 0 ? 'flex' : 'none';
}

async function loadMoreWords() {
  if (allFetchedForTheme.length === 0) return;
  loadMoreBtn.disabled = true;
  const nextBatch = allFetchedForTheme.splice(0, 20);
  await processBatch(nextBatch);
  loadMoreBtn.disabled = false;
  updateLoadMoreVisibility();
}

async function addManualWord() {
  const word = manualWordInput.value.trim().toLowerCase();
  if (!word) return;
  if (!/^[a-z]+$/.test(word)) {
    statusEl.textContent = `"${word}" — only single words (letters only) can be added.`;
    return;
  }
  if (seenWords.has(word)) {
    statusEl.textContent = `"${word}" is already in your candidate list.`;
    manualWordInput.value = '';
    return;
  }

  manualAddBtn.disabled = true;
  statusEl.textContent = `Checking "${word}"...`;
  seenWords.add(word);

  try {
    // confirm the word exists and grab a Datamuse fallback definition,
    // then let buildCandidate prefer the Dictionary API's definition if it has one
    const res = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&md=d&max=1`);
    const data = await res.json();
    const match = data.find(entry => entry.word.toLowerCase() === word) || { word, defs: [] };

    const candidate = await buildCandidate(match);
    if (!candidate) throw new Error('no definition');
    candidate.selected = true;

    candidates.push(candidate);
    candidatesPanel.style.display = 'block';
    renderCandidates();
    statusEl.textContent = `Added "${word}".`;
    manualWordInput.value = '';
  } catch (e) {
    statusEl.textContent = `"${word}" isn't in the dictionary — try another spelling.`;
  }
  manualAddBtn.disabled = false;
}

function renderCandidates() {
  candidateList.innerHTML = '';
  candidates.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'candidate' + (c.selected ? ' selected' : '');

    const head = document.createElement('div');
    head.className = 'candidate-head';
    const sourceTag = c.defSource ? `<span style="font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--paper-dim); margin-left:8px;">via ${c.defSource}</span>` : '';
    head.innerHTML = `
      <span class="word-label">${c.word}</span>${sourceTag}
      <label class="check"><input type="checkbox" ${c.selected ? 'checked' : ''} data-idx="${idx}" class="sel-check"> use this</label>
    `;
    card.appendChild(head);

    const wordEdit = document.createElement('textarea');
    wordEdit.className = 'word-edit';
    wordEdit.value = c.definition;
    wordEdit.addEventListener('input', () => { c.definition = wordEdit.value; });
    card.appendChild(wordEdit);

    const editorWrap = document.createElement('div');
    editorWrap.className = 'chunk-editor';
    renderChunkEditor(editorWrap, c);
    card.appendChild(editorWrap);

    const preview = document.createElement('div');
    preview.className = 'chunk-preview';
    preview.textContent = 'chunks: ' + c.chunks.join(' · ');
    card.appendChild(preview);
    c._previewEl = preview;

    candidateList.appendChild(card);

    card.querySelector('.sel-check').addEventListener('change', (e) => {
      c.selected = e.target.checked;
      card.classList.toggle('selected', c.selected);
      updateBuildState();
    });
  });
  updateBuildState();
}

function renderChunkEditor(container, c) {
  container.innerHTML = '';
  const word = c.word;
  for (let i = 0; i < word.length; i++) {
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = word[i].toUpperCase();
    container.appendChild(letter);

    if (i < word.length - 1) {
      const pos = i + 1;
      const gap = document.createElement('span');
      gap.className = 'gap' + (c.boundaries.has(pos) ? ' active' : '');
      gap.addEventListener('click', () => {
        if (c.boundaries.has(pos)) c.boundaries.delete(pos);
        else c.boundaries.add(pos);
        c.chunks = chunksFromBoundaries(word, c.boundaries);
        gap.classList.toggle('active');
        c._previewEl.textContent = 'chunks: ' + c.chunks.join(' · ');
      });
      container.appendChild(gap);
    }
  }
}

function updateBuildState() {
  const selected = candidates.filter(c => c.selected);
  selectedCountEl.textContent = `${selected.length} selected`;
  buildBtn.disabled = selected.length < 4 || selected.length > 8;
}

function buildPuzzle() {
  const theme = themeInput.value.trim();
  const selected = candidates.filter(c => c.selected);

  const puzzle = selected.map(c => ({
    word: c.definition,
    answer: c.word,
    chunks: c.chunks,
  }));

  const output = {
    theme,
    generated_at: new Date().toISOString(),
    source: "dictionaryapi.dev (primary) + datamuse md=d (fallback), auto-suggested chunks, human-reviewed",
    puzzle,
  };

  jsonOut.textContent = JSON.stringify(output, null, 2);
  exportBox.classList.add('show');
  exportBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(jsonOut.textContent);
  const btn = document.getElementById('copyBtn');
  const original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = original, 1200);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const blob = new Blob([jsonOut.textContent], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const themeSlug = themeInput.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
  a.href = url;
  a.download = `puzzle-${themeSlug || 'theme'}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

generateBtn.addEventListener('click', discoverWords);
loadMoreBtn.addEventListener('click', loadMoreWords);
manualAddBtn.addEventListener('click', addManualWord);
manualWordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addManualWord(); });
buildBtn.addEventListener('click', buildPuzzle);
themeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') discoverWords(); });
</script>
</body>
</html>
